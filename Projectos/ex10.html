<!DOCTYPE html>
<html lang="pt">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            @keyframes gradientBG {
                0% {
                    background-position: 0% 50%;
                }

                50% {
                    background-position: 100% 50%;
                }

                100% {
                    background-position: 0% 50%;
                }
            }

            body {
                animation: gradientBG 8s ease infinte;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(-45deg, #667eea, #764ba2, #6B8DD6, #8E37D7);
                width: 100vw;
                height: 100vh;
            }

            .circle {
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.1);
                animation: float 6s ease-in-out infinite;
            }

            .circle1 {
                width: 200px;
                height: 200px;
                top: 10%;
                left: 15%;
                animation-delay: 0;

            }

            .circle2 {
                width: 300px;
                height: 300px;
                bottom: 5%;
                right: 10%;
                animation-delay: 2s;
            }

            @keyframes float {

                0%,
                100% {
                    transform: translateY(0) scale(1);


                }

                50% {
                    transform: translateY(-30px) scale(1.1);
                }
            }

            @keyframes entrar {
                from {
                    opacity: 0;
                    transform: translateY(40px) scale(0.9);

                    to {
                        opacity: 1;
                        transform: translateY(0) scale(1);
                    }
                }
            }

           

            .btn:hover {
                transform: scale(1.03);
                box-shadow: 0px 10px 12px rgba(0, 0, 0, 0.2);
            }

            .btn::after {
                content: "";
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                background: rgba(118, 75, 162, 0.2);
                transform: scaleX(0);
                transform-origin: left;
                transition: 1s;
            }

            .btn:active:after {
                transform: scaleX(1);
            }

            .form {
                width: 100%;
                height: 40%;
            }

            main {
                width: 100%;
                height: 100%;
                position: absolute;
            }

            section {
                position: relative;
                top: 50%;
                border-radius: 10px;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 300px;
                height: 400px;
                background-color:rgba(255, 255, 255, 0.84);
                box-shadow: 0px 12px 10px rgba(255, 255, 255, 0.3);
                overflow: hidden;
            }.form{
                text-align:center;
              
            }
            input{  margin-bottom:5px;
            width:70%;
            padding:10px 10px;
            height:20px;
            margin-bottom: 10px;
        border-radius:10px;}
button[type=submit]{
     width:60%;
     background: rgba(153, 96, 139, 0.3);
            padding:10px 10px;
            height:50px;
            text-align:center;

        border-radius:10px;
        margin-top:18px;
}
        </style>
    </head>

    <body>
        <div class="circle circle1">

        </div>
        <div class="circle circle2">

        </div>
        <main>
            <section>
                <div class="form">
                     <h1>Criar conta</h1>
                    <form action="" method="post">
                      
                        <div class="campo">
                            <input type="text" name="nome" id="Nome" placeholder="Escreve aqui seu nome" minlenght="0" maxlenght="40" required autocomplete="new-name">
                        </div>

                        <div class="campo">
                            <input type="email" name="email" id="Email" placeholder="Escreve aqui o seu email" minlenght="0" maxlenght="40" required autocomplete="email">
                        </div>
                          <div class="campo">
                            <input type="text" name="email" id="Eml" placeholder="Escreve aqui o seu numero" required autocomplete="new-number" minlenght="0" maxlenght="2" pattern="[0-9]{2}">
                        </div>
                          <div class="campo">
                            <input type="text" name="emal" id="texto" placeholder="Escreve aqui o seu processo" required autocomplete="new-number" minlenght="0" maxlenght="2" pattern="[A-Z]{1}[0-9]{4}">
                        </div>

                        <button type="submit" class="btn">
                            Entrar
                        </button>
                    </form>
        </main>

    </body>

</html>
