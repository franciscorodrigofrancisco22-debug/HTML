<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Oninput</title>
    </head>

    <body>
        <form action="Cadastro.php">
            <p>
                <label for="ANO">Que ano voceu nasceu</label>
                <input type="number" name="numero" id="ANO" min="1900" max="2020" oninput="Calcidade">
            </p>
            <p>
                <label for="Idade">Sua idade</label>
                <output id="Idade">0</output>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
        <script>
            function calcidade() {
                let atual = new Date().getFullYear;
                Idade.innerHTML = Number(autal) - Number(ANO.value)
            }
        </script>
    </body>

</html>
