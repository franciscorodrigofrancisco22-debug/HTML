<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            div.container {
                display: grid;

                border: 3px solid purple;
                grid-template-columns: auto auto auto;
                grid-template-rows: 100px 100px 100px;
                grid-gap: 20px;
                align-items: stretch;
                align-content: center;
                justify-items: stretch;
                justify-content: center;
            }


            .item {
                padding: 3px;
                border: 3px solid red;
            }
        </style>
        <title>Grid layout</title>
    </head>

    <body>

        <div class="container">
            <div class="item">
                A
            </div>
            <div class="item">
                B
            </div>
            <div class="item">
                C
            </div>
            <div class="item">
                D
            </div>
            <div class="item">
                E
            </div>
            <div class="item">
                F
            </div>
            <div class="item">
                G
            </div>
        </div>
    </body>

</html>
