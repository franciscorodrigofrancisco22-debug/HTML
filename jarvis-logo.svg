<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan glow gradient for arc -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c8ff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:0.2" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0f7ff" />
      <stop offset="60%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#00c8ff" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong glow for icon -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip for rounded rect background -->
    <clipPath id="bgClip">
      <rect x="0" y="0" width="400" height="200" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="200" rx="16" ry="16" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#00c8ff" stroke-width="0.5" clip-path="url(#bgClip)">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
  </g>

  <!-- === ICON: J inside hexagon === -->
  <!-- Hexagon outline -->
  <polygon
    points="66,82 82,72 98,82 98,102 82,112 66,102"
    fill="none"
    stroke="#00c8ff"
    stroke-width="1.8"
    filter="url(#glow)"
    opacity="0.9"
  />
  <!-- Inner hexagon -->
  <polygon
    points="70,86 82,79 94,86 94,98 82,105 70,98"
    fill="#00c8ff"
    opacity="0.08"
  />
  <!-- Letter J -->
  <text
    x="82" y="102"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="22"
    font-weight="700"
    fill="#00c8ff"
    filter="url(#strongGlow)"
  >J</text>

  <!-- === MAIN TEXT: JARVIS === -->
  <text
    x="132" y="110"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="10"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >JARVIS</text>

  <!-- Underline accent bar -->
  <rect x="132" y="120" width="240" height="2" rx="1" fill="url(#arcGrad)" opacity="0.7" />

  <!-- Tagline -->
  <text
    x="132" y="143"
    font-family="'Courier New', monospace"
    font-size="11"
    letter-spacing="4"
    fill="#00c8ff"
    opacity="0.6"
  >ARTIFICIAL INTELLIGENCE</text>

  <!-- Top-right corner decoration: arc rings -->
  <g filter="url(#glow)" opacity="0.25">
    <circle cx="370" cy="30" r="28" fill="none" stroke="#00c8ff" stroke-width="1"/>
    <circle cx="370" cy="30" r="20" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
    <circle cx="370" cy="30" r="4" fill="#00c8ff"/>
  </g>

  <!-- Bottom-left faint dot cluster -->
  <g opacity="0.2" fill="#00c8ff">
    <circle cx="30" cy="165" r="2"/>
    <circle cx="40" cy="165" r="2"/>
    <circle cx="50" cy="165" r="2"/>
    <circle cx="30" cy="175" r="2"/>
    <circle cx="40" cy="175" r="2"/>
  </g>
</svg>
