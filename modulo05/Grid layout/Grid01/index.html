<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .container {
                border: 3px solid gray;
                display: grid;
                height: 250px;
                grid-template-columns: auto auto auto;
                grid-template-rows: auto auto auto;
                gap: 5px;
                align-items: normal;
                justify-items: normal;
                align-content: center;
                justify-content: space-around;

            }

            body {
                background: rgba(255, 255, 255, 0.308);
            }

            .item {
                background-color: rgb(128, 11, 2);
                color: white;
                padding: 5px;
                border: 3px solid red;
            }
        </style>
        <title>Grid layout</title>
    </head>

    <body>
        <main class="container">

            <section class="item">A</section>
            <section class="item">B</section>
            <section class="item">C</section>
            <section class="item">D</section>
            <section class="item">E</section>
            <section class="item">F</section>
            <section class="item">G</section>
            <section class="item">H</section>

        </main>

    </body>

</html>
