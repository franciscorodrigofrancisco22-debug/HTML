<!DOCTYPE html>
<html lang="PT-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: sans-serif;
            }

            label {
                cursor: pointer;
                display: block;
            }
        </style>

        <title>Document</title>
    </head>

    <body>
        <form action="#" method="get" target="_blank">
            <p>O meu formulário </p>
            <p>
                <label for="">
                    Nome:
                </label>
                <input type="text" name="nome" id="nome" placeholder="Seu nome " value="">

            </p>
            <p>
                <label for="dev1">
                    Sou um dev
                </label>
                <input type="checkbox" name="dev" id="dev" value="sim" placeholder="sim">

            </p>
            <p>
                <label for="date">Date:</label>
                <input type="date" name="date" id="date" value="2020-04-20" placeholder="Escolha sua data">
            </p>
            <p>
                <label for="Time">Time:</label>
                <input type="time" name="time" id="time" value="20:00:01" placeholder="Escolha seu Tempo">
            </p>
            <p>
                <label for="datetime">Date:</label>
                <input type="datetime-local" name="datetime" id="datetime" value="2020-04-20T">
            </p>
            <p>
                <label for="cor">Cor preferida:</label>
                <input type="color" name="cor" id="cor" value="#FF000">
            </p>
            <p><label for="email">Seu e-mail:</label>
                <input type="email" name="email" id="email" placeholder="Rodrihgkti2@gmail.com">
            </p>
            <p>
                <label for="password">Sua senha:</label>
                <input type="password" id="password" name="password" placeholder="Digite uma senha">


            </p>
            <p>
                <label for="ranger">ranger:</label>
                <input type="range" name="range" id="range" placeholder="Escolha a sua perctentagem" max="10" min="0"
                    step="2">
            </p>
            <p><label for="file">Sua foto:</label>
                <input type="file" id="file" name="file"
                    accept="C:\sites\aula-html\Nova pasta\b49b4fbdeae6b56b8a50ef67a6d7129d116daae0ca106d69720073ac3e8a3dc3.png"
                    multiple>
            </p>
            <p><label for="number">Number:</label>
                <input type="number" name="number" id="number" min="10" max="50" step="5">
            </p>
            <p><label for="Url">Url:</label>
                <input type="url" name="url" id="url" placeholder="Url">
            </p>
            <p><label for="Search">Search</label>
                <input type="search" name="search" id="search" placeholder="Search">
            </p>
            <p>
                <label for="select">Seleciona alguma coisa:</label>
                <select name="select" id="select">
                    <optgroup label="Teste">
                        <option value="qualquer 1" label="Label 1"></option>
                        <option value="qualquer 2" label="Label 2" disabled></option>
                        <option value="qualquer 3" label="Label 3"></option>
                        <option value="qualquer 4" label="Label 4" selected></option>
                        <option value="qualquer 5" label="Label 5"></option>
                    </optgroup>
                </select>
            </p>
            <p><label for="textarea">textarea:</label>
                <textarea name="textarea" id="textarea" rows="3" cols="9">
                    Mais a gente pode voltar
                </textarea>
            </p>
            <p>
                <button type="reset">Reset</button>
                <button type="submit">Entrar</button>
            </p>
        </form>
    </body>

</html>
