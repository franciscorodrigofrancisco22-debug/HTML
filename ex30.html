<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro do IPIZ</title>
        <style>
            @charset "UTF-8";

            body {
                background-color: darkblue;
            }

            h1 {

                text-align: center;
                color: darkgray;
            }

            h4 {
                color: darkgray;
                float: left;
            }

            .container {

                max-width: 400px;
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            input {
                width: 90%;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            button {
                width: 95%;
                padding: 10px;
                background: #010955;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background: #4b6569;
            }

            ul {
                list-style: none;
                padding: 0;
                margin-top: 20px;
            }

            span {
                float: right;
            }

            li {
                background: #eee;
                padding: 10px;
                margin-bottom: 5px;
                border-radius: 4px;
            }



            select {
                width: 100%;
            }

            main {

                border-radius: 20px;
                width: 300px;
                border: 1px solid black;
                padding: 10px;
                margin: 10px;

            }
        </style>
    </head>

    <body>
        <center>
            <main>

                <div class="container">

                    <h1>Iniciar sessão</h1>
                    <form id="formulario">
                        <input type="text" id="nome" placeholder="Nome Completo do aluno" required>
                        <input type="email" id="email" placeholder="seu emai-exexmplo.gmail.com" required>



                        <br>
                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                        <br>
                        <span class="toggle-password" onclick="toggleSenha()">👁️</span>

                        <input type="number" name="number" id="number" placeholder="Número do aluno ">
                        <br>
                        <input type="text" id="processo" placeholder=" Seu número de processo exmplo:I2025" required>
                        <br>

                        <h4>Seleciona uma classe:</h4>

                        <label for="select">
                            <h4>Seleciona O Seu Nível:</h4>
                        </label> <select name="select" id="select">
                            <optgroup label="O Seu Nível">
                                <option label="10ºclasse"></option>
                                <option label="11ºclasse" disabled></option>
                                <option label="12ºclasse"></option>
                                <option label="13ºclasse" selected></option>

                            </optgroup>
                        </select>
                        <br>
                        <br>
                        <button type="submit"> Entrar</button>
                    </form>

                </div>
            </main>

        </center>

        <script>
            function toggleSenha() {
                const campoSenha = document.getElementById("senha");
                // Alterna entre 'password' e 'text'
                if (campoSenha.type === "password") {
                    campoSenha.type = "text";
                } else {
                    campoSenha.type = "password";
                }

            }
        </script>

    </body>

</html>
