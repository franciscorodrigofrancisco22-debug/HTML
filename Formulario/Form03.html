<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            input {
                width: 29%;
                padding: 10px;
                margin: 10px;
                border: 1px solid #918d8d;
                border-radius: 15%;
            }

            body {
                background: rgb(10, 245, 194);
                justify-content: center;

            }

            form,
            label {
                text-align: center;
            }


            h1 {
                text-align: center;
            }
        </style>
        <title>Formulario</title>
    </head>

    <body>
        <h1>Teste de Formulario</h1>
        <form action="Cadastro.php" autocomplete="on" method="get">
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo"
                    autocomplete="name">
            </p>
            <p>
                <label for="imedia">Media</label>
                <input type="number" name="number" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required
                    value="5">
            </p>
            <p><label for="imes">Periodo lectivo</label>
                <input type="month" name="periodo" id="imes" value="2026-08">
            </p>
            <p>
                <label for="dia">Dia da Prova</label>
                <input type="date" name="data" id="dia" value="2026-07-19">
            </p>
            <p>
                <label for="ihorario">Hora da prova</label>
                <input type="time" name="hora" id="ihorario">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </body>

</html>
