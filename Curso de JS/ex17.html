<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <fv:icon></fv:icon>
        <style>
            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }

            body {
                background: rgb(1, 9, 83);
                color: black;
                font: bold 10pt Arial;
                width: 100vw;
                height: 100vh;

            }

            div.container {
                width: 100%;
                height: 100%;
                position: absolute;
            }

            div.r {
                border-radius: 10px;
                background-color: whitesmoke;
                width: 40%;
                height: 40%;
                position: relative;
                top: 50%;
                left: 50%;
                justify-items: center;
                transform: translate(-50%, -50%);
                box-shadow: 0px 0px 12px 12px rgb(116, 161, 202);

            }

            div.r h1 {
                margin-top: 5px;
            }

            input[type=text] {
                border-radius: 10px;
                margin: 5px;
                margin-left: 16%;
                padding: 5px 5px;
                height: 40px;
                width: 68%;

            }

            label {
                margin-left: 16%;

                font-weight: bold;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-size: 24px;

            }

            button[type=button] {
                border-radius: 10px;
                width: 50%;
                background: rgb(64, 109, 161);
                color: white;
                cursor: pointer;
                padding: 5px 5px;
                margin-top: 20px;
                margin-left: 26%;


            }
        </style>
        <title>Soccer play</title>
    </head>

    <body>
        <div class="container">
            <div class="r">
                <h1>Soccer Play</h1>

                <label for="me">Nome completo</label>
                <input type="text" name="nome" id="nome" placeholder="Escreva aqui a sua resposta" required>
                <label for="iade">Sua idade</label>
                <input type="text" name="nome" id="idade" placeholder="Escreva aqui a sua idade" minlength="0"
                    maxlength="2" pattern="[0-9]{2}" required>
                <br>

                <button type="button" onclick="sO()">Entrar</button>
                <button type="button" onclick="jOgar()">
                    Jogar
                </button>


            </div>
        </div>
        <script src="ex17.js">

        </script>
    </body>

</html>
