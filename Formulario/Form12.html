<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IP_IZ</title>
        <link rel="shortcut icon" href="IMG-20260129-WA0001.jpg" type="image/x-icon">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="mediaqueries.css">
    </head>

    <body>
        <main>
            <section id="login">
                <div id="imagens">
                    <img src="IMG-20260129-WA0001.jpg" alt="">
                </div>
                <div id="formulario">
                    <h1>Iniciar sessão</h1>
                    <p> Seja Bem-vindo ou Bem-vinda novamente a escola do IPIZ, Faça a sessão para poder acessar a sua
                        pauta
                    </p>
                    <form action="github.com" method="post" autocomplete="on" name="fExempla" target="_blank">
                        <section name="Exemplo">
                            <div class="campo" name="Campo"><i class="material-icons">person</i>
                                <input type="text" name="texto" id="texte" autocomplete="name" required
                                    placeholder="Insira o  seu nome completo" minlength="0" maxlength="40">
                                <label for="login">Login</label>
                            </div>
                            <div class="campo" name="Campo"><i class="material-icons">mail</i>
                                <input type="email" name="mail" id="login" autocomplete="email" required
                                    placeholder="Insira um email " minlength="0" maxlength="40">
                                <label for="login">Login</label>
                            </div>
                            <div class="campo" name="Campo">
                                <i class="material-icons">password</i>
                                <input type="password" name="senhas" id="senha" minlength="8" maxlength="20"
                                    autocomplete="current-password" required placeholder="Insira   uma senha">
                                <span class="toggle-password" onclick="toggleSenha()">👁️</span>

                            </div>
                            <div class="campo" name="Campo">
                                <i class="material-icons">looks_two</i>
                                <input type="text" name="sen" id="isenha" minlength="0" maxlength="2" required
                                    pattern="[0-9]*" placeholder="Insira   o seu número">
                                <label for="isenha">Senha</label>
                            </div>
                            <div class="campo" name="Campo">
                                <i class="material-icons">settings</i>
                                <input type="text" name="Texta" id="senha" minlength="0" maxlength="5"
                                    autocomplete="current-password" required placeholder="insira o seu processo "
                                    pattern="[A-Za-z][0-9]{4}">
                                <label for="Processo"></label>
                            </div>
                        </section>
                        <input type="submit" value="Enviar">

                    </form>
                </div>
            </section>
        </main>
        <script>
            function toggleSenha() {
                const campoSenha = document.getElementById("senha");
                // Alterna entre 'password' e 'text'
                if (campoSenha.type === "password") {
                    campoSenha.type = "text";
                } else {
                    campoSenha.type = "password";
                }

            }
        </script>
    </body>

</html>
