    <head>

        <style>

            div.item {
                background: rgb(63, 212, 4);
                border: 1px solid black;
                text-align: center;
                flex: auto;
            }
        </style>
        <title>Flexbox</title>
    </head>

    <body>
        <div class="container">
            <div class="item">exmplo de A</div>
            <div class="item">exmplo de B</div>
            <div class="item">exmplo de C</div>
            <div class="item">exmplo de D</div>
            <div class="item">exmplo de E</div>
            <div class="item">exmplo de F</div>
            <div class="item">exmplo de G</div>

        </div>
    </body>


</html>
