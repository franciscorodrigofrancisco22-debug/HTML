<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
            }

            .container {
                width: 100%;
                height: 100vh;
                border: 3px solid rgb(102, 1, 102);
                grid-template: 80px 40px 1fr 40px/ 1fr 150px;
                display: grid;
                gap: 5px;

            }

            .caixa {
                padding: 10px;
                text-align: center;
                background-color: rgb(116, 114, 114);
                border: 1px solid black;
            }

            #topo {
                grid-row: 1/2;
                grid-column: 1/-1;


            }

            #menu {
                grid-row: 2/ 3;
                grid-column: 1/-1;

            }

            #principal {
                grid-row: 3/ 1;
                grid-column: 1/2;

            }

            #Segundario {
                grid-row: 3/ -2;
                grid-column: -2/-1;

            }

            #rodape {
                grid-row: -2/-1;
                grid-column: 1/-1;

            }
        </style>
        <title>Grid layout para itens</title>
    </head>

    <body>
        <div class="container">
            <header class="caixa" id="topo">
                Topo
            </header>
            <nav class="caixa" id="menu">
                Menu
            </nav>
            <main class="caixa" id="Principal">
                Principal
            </main>
            <aside class="caixa" id="Segundario">
                Segunadrio
            </aside>
            <footer class="caixa" id="rodape">
                Rodape
            </footer>
        </div>


    </body>

</html>
