<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-size: 17px;
                line-height: 2.4em;

                width: 100vw;
                height: 100vh;

            }

            main {
                width: 100%;
                height: 100%;
                position: absolute;
            }

            div.container {
                top: 50%;
                box-shadow: 1px 1px 12px 12px rgb(1, 77, 100);
                height: 40%;
                border-radius: 10px;

                width: 60%;
                transform: translate(-50%, -50%);
                left: 50%;
                text-align: center;
                position: relative;
                background: linear-gradient(90deg, darkcyan, darkblue, purple);
                color: black;

            }

            h1 {
                text-align: center;
            }

            input[type=submit] {
                width: 20%;
                margin-top: 5%;
                height: 17%;
                background: linear-gradient(90deg, rgb(12, 89, 119), blue);
                transition: transform 0.2s opacity 0.2s;
                border-radius: 10px;
                cursor: pointer;
            }



            input[type=text] {
                width: 50%;

            }

            input {
                width: 60%;
                height: 9%;
                font-size: 13pt;
                border-radius: 10px;
            }
        </style>
        <title>Calcularadora de Medias</title>
    </head>

    <body>
        <main>
            <div class="container">
                <h1>Calculator</h1>
                <label for="texto">Nome do aluno</label>
                <input type="text" name="nome" id="texto" placeholder="Escreva o seu nome completo">
                <br>

                <label for="n1">Nota 1</label>
                <input type="number" name="nome" id="n1"><br><label for="n2">Nota 2</label>
                <input type="number" name="nom" id="n2"> <br> <label for="n3">Nota 3</label>
                <input type="number" name="nomi" id="n3">
                <br><input type="submit" value="Enviar" onclick="mEdia()">

                <div id="res">
                </div>
                <div id="re0">
                </div>
                <div id="re1">

                </div>

                <div id="re2">

                </div>
                <br>
        </main>
        </div>





        <script src="ex12.js">
        </script>
    </body>

</html>
