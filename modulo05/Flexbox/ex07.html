<!DOCTYPE html>
<html lang="PT-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            div.container {
                display: flex;
                background: red;
                flex-flow: row wrap;


            }

            div.item {
                background: rgb(220, 225, 226);
                border: 1px solid black;
                padding: 20px;
                text-align: center;
            }

            div#i1 {
                order: 0;
            }

            div#i2 {
                order: 0;
            }

            div#i3 {
                order: 0;
            }

            div#i4 {
                order: 0;
            }

            div#i5 {
                order: -9;
            }

            div#i6 {
                order: - 6;
            }

            div#i7 {
                order: -3;
            }
        </style>
        <title>Anatomia dos itens flexbox order</title>
    </head>

    <body>
        <div class="container">


            <div class="item" id="i1">a</div>
            <div class="item" id="i2">b</div>
            <div class="item" id="i3">c</div>
            <div class="item" id="i4">y</div>
            <div class="item" id="i5">s</div>
            <div class="item" id="i6">z</div>
            <div class="item" id="i7">g</div>

        </div>
    </body>

</html>
