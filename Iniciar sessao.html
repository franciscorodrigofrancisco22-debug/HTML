<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jarvis</title>
        <style>
            body {
                background-color: blanchedalmond;

                text-align: center;
            }

            div {}


            input {

                height: 50px;
                width: 20%px;
                font-size: 16px;
                border: 1px solid blanchedalmond;
                border-radius: 15px;
            }

            button {
                background-color: rgb(3, 126, 241);


                height: 50px;
                width: 40%;
                margin: 10px;
                padding: 10px;

                border: 1px solid black;
                border-radius: 15px;
                transition: background-color 0.3s;


            }

            button:hover {
                background-color: darkturquoise;
            }

            button>a {

                text-decoration: none;

            }



            main {
                background-color: white;
                max-width: 40%;
                padding: 10px;
                margin: auto;
                height: 90vh;
                border: 1px solid darkslateblue;
                border-radius: 15px;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>Criar conta </h1>
            <form action="
    ">


                <div class="input-group">

                    <label for="Email">Email</label>
                    <br>
                    <input type="email" name="" id="" required placeholder="rodrigofrancisco2@gmail.com" requerid>
                </div>
                <br>
                <div class="input-group">

                    <label for="Senha">Password</label>
                    <br>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                    <span class="toggle-password" onclick="toggleSenha()">👁️</span>
                </div>
                <br>

                <div class="input-group">
                    <label for="Senha">Password</label>
                    <br>
                    <input type="password" id="password" placeholder="cormfirma sua senha" required>

                </div>
                <button class="bt-login"><a href="#">Entrar</a></button>
        </main>

        </form>

        <script>
            function toggleSenha() {
                const campoSenha = document.getElementById("senha");
                // Alterna entre 'password' e 'text'
                if (campoSenha.type === "password") {
                    campoSenha.type = "text";
                } else {
                    campoSenha.type = "password";
                }

            }
        </script>
    </body>

</html>
