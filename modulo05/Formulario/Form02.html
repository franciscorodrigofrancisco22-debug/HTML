<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
    </head>

    <body>
        <h1>Teste no Formulario</h1>
        <form action="Cadastro.php" autocomplete="on" method="post">
            <p>
                <label for="iUse">Usuario</label>
                <input type="text" name="Use" id="iUse" required minlength="5" maxlength="15" size="10"
                    placeholder="Nome do Usuário  " autocomplete="username">

            </p>
            <p>
                <label for="isenha"> Senha</label>
                <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" size="8"
                    placeholder="Mínimo 8 letras" autocomplete="current-password">

            </p>
            <p> <input type="submit" value="Enviar" required>
                <input type="reset" value="Limpar" required>
            </p>
        </form>


    </body>

</html>
