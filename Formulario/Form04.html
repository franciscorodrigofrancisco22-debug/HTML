<!DOCTYPE html>
<html lang="PT-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            fieldset {
                border: 2px solid black;
                background: rgb(110, 110, 110);
            }
        </style>
        <title>Formulario</title>
    </head>

    <body>
        <h1>Cadastramento</h1>
        <fieldset>
            <legend>Dados pessoais</legend>

            <form action="Cadastro.py" method="get" autocomplete="on">
                <p>
                    <label for="Name">Nome</label>
                    <input type="text" name="Nam" id="Name" placeholder="Digite o seu " autocomplete="name">
                </p>
                <p>
                    <label for="Iemail">Email</label>
                    <input type="email" name="email" id="Iemail" required>
                </p>
                <p>
                    <label for="Idd">Telefone</label>
                    <input type="tel" name="telefone" id="Idd" autocomplete="tel-national" required
                        pattern="[0-9]{3} [0-9]{3} [0-9]{3}" placeholder="XXX-XXX-XXX">
                </p>
                <!--Estudar mais sobre regular-->
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            </form>
        </fieldset>
    </body>

</html>
