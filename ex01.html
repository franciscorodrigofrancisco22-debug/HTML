<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            @charset "UTF-8";

            .pai {
                padding: 10px;
                height: 96vh;
                background-color: red;
                background-size: 100% 100%;

                position: relative;
                background-image: url("141335.jpg");
            }

            .filho {
                background-image: url("1322308.jpeg");
                position: absolute;
                left: 50%;
                top: 50%;
                width: 400px;
                height: 200px;
                background-color: yellow;
                background-size: 100% 100%;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>

    <body>
        <section class="pai">
            <article class="filho"></article>
        </section>
    </body>

</html>
