<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .container {
                border: 3px solid rgb(3, 17, 92);
                display: grid;
                grid-template: repeat(3, 80px) / 100px 40% 1fr 1fr 1fr;
                grid-auto-flow: column;
                gap: 5px;
                grid-auto-rows: 80px;
                grid-auto-columns: 120px;


                place-items: normal noraml;
                place-content: normal noraml;



            }



            .item {

                color: rgb(12, 12, 12);
                padding: 7px;
                text-align: center;
                border: 3px solid red;
            }
        </style>
        <title>Grid layout</title>
    </head>

    <body>
        <main class="container">

            <section class="item">A</section>
            <section class="item">B</section>
            <section class="item">C</section>
            <section class="item">D</section>
            <section class="item">E</section>
            <section class="item">F</section>
            <section class="item">G</section>
            <section class="item">H</section>
            <section class="item">I</section>
            <section class="item">J</section>
        </main>


    </body>

</html>
