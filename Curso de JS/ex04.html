<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {

                font: bold 20pt arial;
            }
        </style>
        <title>Javascript</title>
    </head>

    <body>
        <script>
            var nome = window.prompt("Qual é o seu nome?")
            document.write(`Ola   ${nome} ! Seu nome ${nome} Tem ${nome.length} letras <br>`)
            document.writeln(`${nome}  Seu nome em  maiscúlo ${nome.toUpperCase()} <br>`)
            document.writeln(`${nome}   Seu nome em  miniscúlo ${nome.toLocaleLowerCase()}`)
        </script>
    </body>
    </body>

</html>
