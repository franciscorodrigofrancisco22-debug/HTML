<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>formulario</title>
    </head>

    <body>
        <h1>Formulario</h1>
        <Form action="Cadastro.py" method="post" autocomplete="on" target="_blank">
            <p>
                <label for="color">Color</label>
                <input type="color" name="colo" id="color" value="green">
            </p>
            <p>
                <label for="colorr">Range</label>
                <input type="range" name="coloe" id="colorr" min="0" max="5" value="5">
            </p>
            <p>
                <label for="foto">Foto de perfil</label>
                <input type="file" name="folo" id="foto">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </Form>
    </body>

</html>
