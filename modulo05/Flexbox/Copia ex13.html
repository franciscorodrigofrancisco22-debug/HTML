<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu responsivo com flexbox</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }

            body {
                width: 100%;
                height: 100%;
                background-color: orange;
            }

            div.pai {
                padding: 10px;
                display: flex;
                color: white;
                align-items: center;
                flex-flow: row wrap;
                justify-content: space-between;
                background-color: orange;

            }

            div.pai>div.filho>a:hover {
                background-color: white;
                color: black;
                transition: background-color 1s;
            }

            div.filho {

                display: flex;
                flex-flow: row wrap;
                justify-content: flex-end;
            }

            div.pai>div.filho>a {
                border-radius: 5px;
                color: white;
                text-decoration: none;
                padding: 10px;
                margin: 5px;
                text-align: center;
                background-color: rgb(14, 13, 13);
            }

            div.pai>h1 {
                text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.822);
                flex: 0 0 200px;
            }

            div.Sogro {

                background-color: white;
                padding: 10px;
                margin: 10px;
                border-radius: 10px;

                box-shadow: 3px 2px 3px rgba(0, 0, 0, 0.753);
            }

            iframe {
                width: 100%;
                height: 100%;
            }
        </style>
        <link rel="stylesheet" href="copia do mediaqueris.css " media="screen and (max-width:580px)">
    </head>

    <body>
        <div class="pai">
            <h1>Bem-vindo ao IPIZ</h1>

            <div class="filho">
                <a href="#">Home</a>
                <a href="#">Settings</a>
                <a href="../Formulario/Form11.html">Login</a>
                <a href="../Formulario/Form13.html">Session</a>
                <a href="https//facebook.com/" target="_blank">Messanges</a>
                <a href="#">Others</a>
            </div>
        </div>
        <div class="Sogro">
            <h2>MEU LIVRO</h2>
            <iframe
                src="_yande.re 1143937 sample blood monster na_honjaman_level_up silhouette sung_jin-woo tagme weapon.jpg"
                frameborder="0">

            </iframe>
        </div>
    </body>

</html>
