<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                margin: 0;
                padding: 0;
                font-family: Arial, Helvetica, sans-serif;
            }

            BODY {
                background: url("fundo-madeira.jpg") no-repeat top center;
                background-size: cover;
                background-attachment: fixed;
            }

            html,
            body {
                height: 100vh;
                width: 100vw;
                background-color: black;
            }

            main {
                height: 100vh;
                position: relative;

            }

            iframe#tela {
                position: relative;
                top: 80px;
                left: 22px;
                width: 267px;
                height: 471px;

            }

            section#redesociais img:hover {
                transform: translate(-3px, -3px);
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.600);
                border: 2px solid rgba(255, 255, 255, 0.63);
                transition: transform 0.5s;
            }

            section#redesociais {
                text-align: right;
            }

            section#redesociais img {
                width: 50px;
                margin: 10px;

                box-sizing: border-box;

                border-radius: 50%;
                box-shadow: 2px 2px 5px rgb(8, 8, 8);
            }

            section#Telefone {
                position: absolute;
                transform: translate(-50%, -50%);
                background-repeat: no-repeat;
                background-image: url("frame-iphone.png");
                top: 50%;
                left: 50%;
                height: 627px;
                width: 311px;


            }
        </style>
        <title>Projeto Social</title>
    </head>

    <body>
        <main>

            <section id="Telefone">
                <iframe src="ex2.html" name="tela" id="tela" frameborder="0">
                    O navegador não é compatível com isso
                </iframe>
            </section>
            <section id="redesociais">
                <a href="ex2.html" target="tela">
                    <img src="logo-home.jpg" alt="youtube.com">
                </a><br> <a href="youtube.html" target="tela">
                    <img src="logo-youtube.jpg" alt="github.com">
                </a> <br><a href="github.html" target="tela">
                    <img src="logo-github.jpg" alt="">
                </a>
                <br> <a href="twitter.html" target="tela">
                    <img src="logo-twitter.jpg" alt="logo-twitter.jpg">
                </a> <br><a href="facebook.html" target="tela">
                    <img src="logo-facebook.jpg" alt="">
                </a> <br> <a href="instragram.html" target="tela">
                    <img src="logo-instagram.jpg" alt="">
                </a> <br>
            </section>
        </main>



    </body>

</html>
