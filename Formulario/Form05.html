<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            fieldset {
                border: 2px solid black;
            }
        </style>
        <title>Formulario</title>
    </head>

    <body>
        <h1>Cadastramento</h1>
        <form action="
    Cadastro.py" method="get">
            <fieldset>
                <legend>Sexo</legend>
                <label for="Ima">Masculino</label>

                <input type="radio" name="name" id="Ima" value="M">
                <br>
                <label for="Ta">Femenino</label>
                <input type="radio" name="name" id="Ta" checked value="F">
            </fieldset>
            <fieldset>
                <legend>Esportes</legend>
                <label for="Forma">Futeboll</label>
                <br>
                <input type="checkbox" name="name" id="Forma" checked>Futeboll

                <br>

                <label for="Form">Hoquei</label>
                <br>
                <input type="checkbox" name="name" id="Form">Hoquei
            </fieldset>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limapar">
            </p>
        </form>
    </body>

</html>
