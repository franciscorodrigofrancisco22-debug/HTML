<!DOCTYPE html>
<html lang="pt">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro do IPIZ</title>
        <style>
            * {

                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                position: relative;
                background-color: darkblue;
            }

            h1 {
                color: darkgray;
                text-align: center;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
            }

            .container {

                max-width: 400px;
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            input {
                width: 90%;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 15%;
            }

            button {
                width: 95%;
                padding: 10px;
                background: rgb(5, 5, 78);
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background: #4b6569;
            }



            li {
                background: #eee;
                padding: 10px;
                margin-bottom: 5px;
                border-radius: 4px;
            }

            main {
                position: absolute;

                border-radius: 20px;
                width: 300px;
                border: 1px solid black;
                padding: 10px;
                margin: 10px;
                top: 50%;
                left: 50%;
                background-attachment: fixed;
                transform: translate(-40%, -0%);
            }

            form,
            label {
                text-align: left;
            }
        </style>
    </head>

    <body>


        <main>
            <div class="container">
                <h1>Iniciar sessão</h1>
                <form id="Cadastro.php" method="post">
                    <label for="nome">Name</label>
                    <input type="text" id="nome" placeholder="Nome Completo do aluno" required minlength="5"
                        maxlength="30">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu emai-exexmplo.gmail.com" required> <label
                        for="senha">Password</label>
                    <input type="password" name="senha" id="senha" placeholder="Mínimo  8 letras " minlength="8"
                        maxlength="20">
                    <label for="inumber">Number</label>
                    <inpbut type="number" name="number" id="inumber" placeholder="Número do aluno " min="0" max="50">
                        <label for="isenha">Senha</label>
                        <input type="senha" id="isenha" placeholder="Seu  número de processo exemplo:I2025" required
                            minlength="1" maxlength="5">
                        <br>


                        <label for="select">
                            <h4>Seleciona o Seu Nível :</h4>
                        </label> <select name="select" id="select">
                            <optgroup label="Seu Nível">
                                <option label="10ºclasse"></option>
                                <option label="11ºclasse"></option>
                                <option label="12ºclasse"></option>
                                <option label="13ºclasse"></option>

                            </optgroup>
                        </select>
                        <br>
                        <br>
                        <button type="submit"> Entrar</button>
                </form>
            </div>
        </main>




    </body>

</html>
