<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>login</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="mediaqueries.css">
    </head>

    <body>
        <main>
            <section id="login">
                <div id="imagens">
                </div>
                <div id="formulario">
                    <h1>Login</h1>
                    <p> Seja Bem-vindo ou Bem-vinda novamente a escola do IPIZ, Faça o login para acessar sua conta e
                        para poder acessar a sua pauta. </p>
                    <form action="Form13.html" method="post" autocomplete="on">
                        <div class="campo"><i><img src="programacao.png" alt="" id="robo"></i>

                            <input type="email" name="email" id="login" autocomplete="email" required>
                            <label for="login">Login</label>
                        </div>
                        <div class="campo">
                            <i><img src="robo.png" alt="" id="robo"></i>
                            <input type="password" name="sena" id="isenha" minlength="8" maxlength="20"
                                autocomplete="current-password" required>
                            <label for="isenha">Senha</label>
                        </div>
                        <input type="submit" class=" botao" value="Entrar">

                        <a href="Esqueceu a sua senha?">Esqueceu a sua senha?</a>



                    </form>
                </div>
            </section>
        </main>

    </body>

</html>
