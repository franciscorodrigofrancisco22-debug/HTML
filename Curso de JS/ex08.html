    <body>

        <label for="textv">Escolha um país:</label> <input type="text" name="tetxv" id="textv"

        <input type="button" value="Enviar" onclick="Pais()">

        </div>
        <script>
            function Pais() {
                var textve = window.document.getElementById("textv");

                if (vel == "Brazil") {
                    alert(`Você é   Brasileiro!`);

                }

                }

                res.innerHTML = `O seu pais é ${vel}`;


            }
        </script>
