<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meta IA</title>
        <link rel="shortcut icon" href="robo.png" type="image/x-icon">
        <link rel="stylesheet" href="Form11.css">
        <link rel="stylesheet" href="Form11.02.css">
    </head>

    <body>
        <main>
            <section id="login">
                <div id="imagens">

                </div>
                <div id="formulario">
                    <h1>Login</h1>
                    <p>
                        Seja Bem-vindo ou Bem-vinda novamente a escola do IPIZ, Faça o login para acessar sua conta e
                        para poder acessar a sua pauta.
                    </p>
                    <form action="https:/google.com/brazzers.com/" target="_blank" method="post" autocomplete="on">
                        <p>
                        <div class="campo"><i><img src="programacao.png" alt="" id="robo"></i>
                            <input type="email" name="email" id="login" autocomplete="email" required>
                            <label for="login">Login</label>
                        </div>

                        <div class="campo">
                            <i><img src="robo.png" alt="" id="robo"></i>
                            <input type="password" name="sena" id="isenha" minlength="8" maxlength="20"
                                autocomplete="current-password" required>
                            <label for="isenha">Senha</label>
                        </div>

                        <p><input type="submit" class=" botao" value="Entrar"></p>


                        <p>
                            <input type="reset" value="Limpar">
                        </p>
                        <a href="Esqueceu a sua senha?">Esqueceu a sua senha?</a>
                    </form>
                </div>
            </section>
        </main>
    </body>

</html>
