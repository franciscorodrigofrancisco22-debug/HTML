<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formula</title>
    </head>

    <body>
        <h1>Cadastra</h1>
        <form action="Cadastro.py" method="get" autocomplete="on" target="_blank"></form>

        <p>
            <label for="dala">Escolha</label>
            <select name="daa" id="dala">
                <optgroup label="Estado">
                    <option value="Qual estado">Rio</option>
                    <option value="Sim">Rio</option>
                    <option value="Sim">Rio</option>
                    <option value="on" selected>Ro</option>
                </optgroup>
                <optgroup label="Estado">
                    <option value="Qual estado">Rio</option>
                    <option value="Sim">Rio</option>
                    <option value="Sim">Rio</option>
                    <option value="on">Rio</option>
                </optgroup>
            </select>
        </p>
        <p><label for="rolo">Profissions</label>
            <input type="text" name="dala" id="rolo" list="sedprof">
            <datalist id="sedprof">
                <option>Admistrador</option>
                <option>Contabilista</option>
                <option>Futebolista</option>
                <option>Cameran</option>
                <option>Assiste</option>
                <option>Comissario</option>
            </datalist>
        </p>
        <p>
            <label for="Dala">Mensagem:</label>
            <br>
            <textarea name="nome" id="Dala" placeholder="Sua mensagem">Sua mensagem</textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </body>

</html>
